    intro: { es: Lo que abro cada día., en: What I open every day. }
    items:
      - name: Claude Code
        category: { es: Asistente, en: Assistant }
        why:
          es: "A diario, en el trabajo y en proyectos personales. Con un CLAUDE.md por proyecto y comandos propios para lo repetitivo, como traducir las notas de esta web."
          en: "Every day, at work and on personal projects. With a CLAUDE.md per project and custom commands for repetitive work, like translating the notes on this site."
      - name: "Cursor"
        category: { es: Editor, en: Editor }
        why: { es: "Empecé con VS Code y me pasé a Cursor por lo rápido que dejaba probar modelos nuevos. Hoy lo uso junto a Claude Code y sigo en él por comodidad, con todo ya montado.", en: "I started with VS Code and switched to Cursor because it let me try new models so quickly. Today I use it alongside Claude Code, and I stick with it because everything is already set up." }
      - name: "Warp / Git bash"
        category: { es: Terminal, en: Terminal }
        why: { es: "Warp para el día a día; Git Bash cuando necesito un entorno Unix en Windows.", en: "Warp for everyday work; Git Bash when I need a Unix environment on Windows." }

  - id: web
    title: { es: Esta web, en: This site }
    intro: { es: "Lo que predico, aplicado aquí.", en: "What I preach, applied here." }
    items:
      - name: "Astro"
        category: { es: Base, en: Foundation }
        why: { es: "Cero JavaScript por defecto, contenido en Markdown y una DX excelente. Justo lo que necesita una web personal.", en: "Zero JavaScript by default, content in Markdown and excellent DX. Exactly what a personal site needs." }
      - name: Instrument Serif · IBM Plex
        category: { es: Tipografía, en: Typography }
        why:
          es: Una serif con carácter para los titulares y una familia sans y mono muy legible para el resto.
          en: A serif with character for the headlines and a very readable sans and mono family for everything else.
      - name: { es: API de Claude, en: Claude API }
        category: { es: Versión IA, en: AI version }
        why:
          es: El chat del capítulo IA responde con mi CV y mis notas como contexto.
          en: The chat in the AI chapter answers with my CV and my notes as context.
      - name: "Cloudflare"
        category: { es: Despliegue, en: Deployment }
        why: { es: "Se publica sola con cada push, se sirve desde una CDN global y el plan gratuito no limita la transferencia. Para una web personal que no da dinero, es perfecto.", en: "It deploys itself on every push, it is served from a global CDN and the free plan does not cap bandwidth. For a personal site that makes no money, it is perfect." }

